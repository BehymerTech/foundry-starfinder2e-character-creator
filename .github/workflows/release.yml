name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Stamp version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' module.json > module.tmp && mv module.tmp module.json
      - name: Package
        run: zip -r module.zip module.json scripts styles lang README.md LICENSE
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
